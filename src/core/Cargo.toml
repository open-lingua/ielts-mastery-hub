[package]
name = "open-lingua-ielts-mastery-hub-core"
version = "1.0.0-rc.2"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.20"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.7.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util", "time"] }
mockall = "0.13"
rstest = "0.23"
pretty_assertions = "1.4"
assert_matches = "1.5"
