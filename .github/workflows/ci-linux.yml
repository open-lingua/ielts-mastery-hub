name: CI (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-consistency:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
      - name: Verify version strings agree across tracked files
        run: node scripts/check-version-consistency.mjs

  frontend:
    name: Frontend - Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend - Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Tauri 2 / Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            sqlite3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/core -> target"
          shared-key: "backend-${{ runner.os }}-${{ hashFiles('src/core/Cargo.lock') }}"
          cache-on-failure: true
      - name: Prepare SQLite database
        working-directory: src/core
        run: |
          for f in $(ls src/database/migrations/*.sql | sort); do
            sqlite3 dev.db < "$f"
          done
      - name: Lint Rust (clippy)
        working-directory: src/core
        env:
          DATABASE_URL: sqlite:dev.db
        run: cargo clippy -- -D warnings
      - name: Build test binaries
        working-directory: src/core
        env:
          DATABASE_URL: sqlite:dev.db
        run: cargo test --no-run
      - name: Run Rust tests
        working-directory: src/core
        env:
          DATABASE_URL: sqlite:dev.db
        run: cargo test --no-fail-fast
