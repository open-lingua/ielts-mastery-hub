name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run test
      - run: npm run build
