name: PR Title Lint

# Enforces Conventional Commit formatting on pull request titles. Since this
# repo typically squash-merges PRs, the PR title becomes the commit message
# on `main` that release-please parses to determine the next version bump
# and changelog section — so a malformed title would silently break both.
# See RELEASES.md / release-process.mdx for the full release automation.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            ci
            test
            perf
            build
            style
            revert
          requireScope: false
